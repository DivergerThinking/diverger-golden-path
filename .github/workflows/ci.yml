name: ci

# CI de cada PR: trailers de autoría, lint, contratos, dependencias entre contextos, tipos, tests, dependencias con
# vulnerabilidades conocidas (SCA), la infraestructura como código y la imagen del contenedor con
# su análisis. El análisis del código (SAST) está en codeql.yml y el de secretos en secretos.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  TOFU_VERSION: 1.12.8
  TOFU_SHA256: e280accc5e074c69d6b731cca939d4d030fdffc616b146e35227cd0c9208ba82

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # EN-OPS-04: CODEOWNERS sigue cubriendo .diverger/settings.json y a sí mismo.
      - name: CODEOWNERS de la configuración
        run: node scripts/codeowners.mjs
      - name: Generar tipos desde los contratos
        run: npm run gen
      - name: Lint
        run: npm run lint
      - name: Linter de OpenAPI
        run: npm run lint:openapi
      - name: Linter de dependencias entre contextos
        run: npm run lint:deps
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Dependencias con vulnerabilidades conocidas (SCA)
        run: npm audit --audit-level=high

  # Cada commit de un agente lleva los trailers de rol, modelo y tarea (scripts/git-hooks).
  trailers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trailers de autoría
        env:
          RANGO: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node scripts/trailers.mjs "$RANGO"

  # Solo en la plantilla: un repositorio creado desde ella recibe los ficheros de este commit y
  # nada más, así que se exportan a una carpeta limpia y se comprueban ahí desde cero.
  repo-nuevo:
    if: github.repository == 'DivergerThinking/diverger-golden-path'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Exportar el commit a una carpeta limpia
        run: |
          mkdir "$RUNNER_TEMP/repo-nuevo"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/repo-nuevo"
      - name: Comprobar el repositorio nuevo
        working-directory: ${{ runner.temp }}/repo-nuevo
        run: |
          npm ci
          npm run check
          npm run build

  # Infraestructura como código (EN-GP-03, ADR 0013 del harness): formato, validación contra el
  # esquema del proveedor y pruebas del plan con el proveedor simulado. No entra en GCP ni
  # necesita credenciales; aplicar y detectar la deriva se hace con la sesión de quien aplica.
  infraestructura:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # El binario y no setup-opentofu, con su suma comprobada, como Trivy y gitleaks.
      - name: Instalar OpenTofu
        working-directory: ${{ runner.temp }}
        run: |
          f="tofu_${TOFU_VERSION}_linux_amd64.zip"
          curl -sSfL -o "$f" "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/$f"
          echo "${TOFU_SHA256}  $f" | sha256sum -c -
          unzip -q "$f" tofu
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Formato
        run: tofu fmt -check -recursive -diff
      - name: Iniciar sin estado remoto
        run: tofu init -backend=false -input=false
      - name: Validar
        run: tofu validate
      - name: Pruebas del plan
        run: tofu test

  imagen:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir la imagen
        run: docker build -t aplicacion:ci .
      # El binario y no trivy-action, con su suma comprobada, como gitleaks en secretos.yml.
      - name: Instalar Trivy
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" trivy
      - name: Analizar la imagen
        run: ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress aplicacion:ci
